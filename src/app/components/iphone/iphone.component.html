<div class="iphone-container">
  <!-- iPhone device frame -->
  <div class="iphone-frame">
    <!-- Dynamic Island / Notch area -->
    <div class="dynamic-island">
      <div class="dynamic-island-content"></div>
    </div>
    
    <!-- Status bar -->
    <div class="status-bar">
      <div class="status-bar-time">{{ formatTime(currentTime) }}</div>
      <div class="status-bar-icons">
        <!-- Signal bars -->
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none" class="signal-bars">
          <rect x="1" y="14" width="4" height="6" rx="1" ry="1"></rect>
          <rect x="7" y="10" width="4" height="10" rx="1" ry="1"></rect>
          <rect x="13" y="6" width="4" height="14" rx="1" ry="1"></rect>
          <rect x="19" y="2" width="4" height="18" rx="1" ry="1"></rect>
        </svg>
        
        <!-- WiFi icon -->
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-wifi">
          <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
          <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
          <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
          <line x1="12" y1="20" x2="12.01" y2="20"></line>
        </svg>
        
        <!-- Full battery -->
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-battery">
          <rect x="1" y="6" width="18" height="12" rx="2" ry="2"></rect>
          <rect x="3" y="8" width="14" height="8" rx="1" ry="1" fill="currentColor"></rect>
          <line x1="23" y1="13" x2="23" y2="11"></line>
        </svg>
      </div>
    </div>
    
    <!-- Messages screen -->
    <div class="messages-screen">
      <!-- Contact header -->
      <div class="contact-header">
        <div class="back-button">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-chevron-left"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </div>
        <div class="contact-info">
          <div class="contact-name">{{ typingState.contact }}</div>
          <div class="contact-status">{{ isIMessage ? 'iMessage' : 'SMS' }}</div>
        </div>
        <div class="contact-avatar">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-user"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
      </div>
      
      <!-- Messages content -->
      <div class="messages-content">
        <div class="messages-list">
          <div 
            *ngFor="let message of messages" 
            class="message-item" 
            [ngClass]="{
              'received': message.isReceived, 
              'sent': !message.isReceived,
              'imessage': isIMessage,
              'sms': !isIMessage
            }"
            [@bubbleAnimation]="message.isAnimated"
            [@fadeAway]="message.isFadingAway">
            <div class="message-bubble">
              {{ message.text }}
              <div class="message-metadata">
                <span *ngIf="!message.isReceived && message.isRead" class="message-status read">Read</span>
                <span *ngIf="!message.isReceived && message.isDelivered && !message.isRead" class="message-status delivered">Delivered</span>
                <span class="message-time">{{ formatTime(message.timestamp) }}</span>
              </div>
            </div>
          </div>
          
          <!-- Typing indicator -->
          <div *ngIf="typingState.isTyping" class="typing-indicator" [ngClass]="{'imessage': isIMessage, 'sms': !isIMessage}">
            <div class="typing-bubble">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Message input -->
      <div class="message-input-container">
        <div class="message-input-wrapper">
          <div class="camera-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-camera"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
          </div>
          <div class="message-input">
            <span class="placeholder">{{ isIMessage ? 'iMessage' : 'SMS' }}</span>
          </div>
          <div class="voice-button">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-mic"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Home indicator / swipe bar -->
    <div class="home-indicator"></div>
  </div>
  
  <!-- Controls -->
  <div class="controls-container">
    <!-- Restart button -->
    <button class="control-button restart-button" (click)="restartConversation()">
      Restart Animation
    </button>
    
    <!-- iMessage/SMS Toggle switch -->
    <div class="toggle-container">
      <label class="toggle-label">
        <span>{{ isIMessage ? 'iMessage (Blue)' : 'SMS (Green)' }}</span>
        <div class="toggle-switch" [ngClass]="{'active': isIMessage}" (click)="toggleMessageStyle()">
          <div class="toggle-slider"></div>
        </div>
      </label>
    </div>
    
    <!-- Loop Mode Toggle switch -->
    <div class="toggle-container">
      <label class="toggle-label">
        <span>{{ isLoopMode ? 'Loop Mode: On' : 'Loop Mode: Off' }}</span>
        <div class="toggle-switch" [ngClass]="{'active': isLoopMode}" (click)="toggleLoopMode()">
          <div class="toggle-slider"></div>
        </div>
      </label>
    </div>
  </div>
</div>
